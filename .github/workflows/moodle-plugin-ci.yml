name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Moodle ${{ matrix.moodle-branch }}
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [MOODLE_405_STABLE, MOODLE_502_STABLE]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: Moodle coding standards
        run: moodle-plugin-ci phpcs
      - name: Plugin validation
        run: moodle-plugin-ci validate
      - name: PHPUnit
        run: moodle-plugin-ci phpunit

  package-layout:
    name: Installable package layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Moodle plugin archive layout
        run: |
          mkdir -p build/coursecoach
          git archive --format=tar HEAD | tar -xf - -C build/coursecoach
          test -f build/coursecoach/version.php
          grep -q "\$plugin->component = 'local_coursecoach';" build/coursecoach/version.php
          (cd build && zip -qr coursecoach.zip coursecoach)
          unzip -Z1 build/coursecoach.zip | grep -qx 'coursecoach/version.php'
